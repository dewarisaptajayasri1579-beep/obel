org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError --enable-native-access=ALL-UNNAMED
# Workaround for "Could not close incremental caches" BTAPI bug on Windows (Kotlin Gradle plugin 2.x)
kotlin.incremental=false
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
# flutter_inappwebview_android 1.1.3 still calls getDefaultProguardFile(
# 'proguard-android.txt'), which AGP 9+ rejects — fixed upstream only in
# flutter_inappwebview 6.2.0-beta.3. This flag is the documented workaround
# until we're ready to move off the beta. Remove once the package updates.
android.r8.proguardAndroidTxt.disallowed=false
